<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marco Arte</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="galeria">

  <div id="atmosfera"><div class="capa" id="atm-a"></div><div class="capa" id="atm-b"></div></div>

  <main id="sala">
    <!-- Reloj estilo pantalla de bloqueo, con números de vidrio líquido -->
    <div id="reloj">
      <div id="reloj-fecha"></div>
      <div id="reloj-hora">
        <canvas id="hora-sombra" aria-hidden="true"></canvas>
        <div id="hora-vidrio" aria-hidden="true"></div>
        <canvas id="hora-texto" role="img" aria-label="Hora"></canvas>
      </div>
      <div id="reloj-clima"></div>
    </div>

    <div id="lienzo">
      <div class="marco" id="marco-a"><img id="img-a" alt=""></div>
      <div class="marco" id="marco-b"><img id="img-b" alt=""></div>
      <div id="espera">
        <p class="espera-titulo">Colgando la primera obra…</p>
        <p class="espera-nota" id="espera-nota">Buscando pinturas en la colección del Art Institute of Chicago</p>
      </div>
    </div>

    <aside id="columna">
      <div id="hora-bloque">
        <div id="hora"><span id="hora-num">--:--</span><span id="hora-ampm"></span></div>
        <div id="fecha"></div>
        <div id="clima"><span id="clima-temp"></span><span id="clima-texto"></span><span id="clima-rango"></span></div>
      </div>

      <div id="cartela">
        <span id="obra-fija" hidden><svg viewBox="0 0 24 24"><path d="M15.5 3.5l5 5-2.3.6-3.7 3.7.4 4.3-1.6 1.6-3.6-3.6-4.6 4.6-1.1-1.1 4.6-4.6-3.6-3.6 1.6-1.6 4.3.4 3.7-3.7z"/></svg>Fija</span>
        <h1 id="obra-titulo"></h1>
        <p id="obra-artista"></p>
        <p id="obra-fecha"></p>
        <p id="obra-tecnica"></p>
        <p id="obra-credito"></p>
      </div>
    </aside>
  </main>

  <!-- Control de Spotify: solo pausar, adelantar y atrasar -->
  <div id="musica" aria-live="polite">
    <img id="musica-portada" alt="">
    <div id="musica-info">
      <div id="musica-titulo"></div>
      <div id="musica-artista"></div>
      <div id="musica-linea"><i id="musica-avance"></i></div>
      <div id="musica-tiempos"><span id="musica-va">0:00</span><span id="musica-falta">-0:00</span></div>
    </div>
    <div id="musica-botones">
      <span class="boton-musica" id="musica-anterior"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="2.6" height="14" rx="1"/><path d="M19 6.2v11.6a1 1 0 0 1-1.55.83L9 13.2a1.4 1.4 0 0 1 0-2.4l8.45-5.43A1 1 0 0 1 19 6.2z"/></svg></span>
      <span class="boton-musica" id="musica-pausa"></span>
      <span class="boton-musica" id="musica-siguiente"><svg viewBox="0 0 24 24"><rect x="17.4" y="5" width="2.6" height="14" rx="1"/><path d="M5 6.2v11.6a1 1 0 0 0 1.55.83L15 13.2a1.4 1.4 0 0 0 0-2.4L6.55 5.37A1 1 0 0 0 5 6.2z"/></svg></span>
    </div>
  </div>

  <div id="noche"></div>
  <div id="aviso" role="status"></div>

  <div id="ajustes" hidden>
    <div class="ajustes-caja">
      <h2>Ajustes</h2>
      <ul id="ajustes-lista"></ul>
      <p class="ajustes-ayuda"><b>▲ ▼</b> moverse &nbsp;·&nbsp; <b>◀ ▶</b> cambiar &nbsp;·&nbsp; <b>Atrás</b> cerrar</p>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
