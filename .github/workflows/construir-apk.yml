name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp app/build/outputs/apk/release/app-release.apk marco-arte-tv.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Marco Arte ${{ github.run_number }}
          body: |
            Para instalar o actualizar en el Fire TV, abre Downloader y escribe:
            https://github.com/${{ github.repository }}/releases/latest/download/marco-arte-tv.apk
          files: marco-arte-tv.apk
          make_latest: true
